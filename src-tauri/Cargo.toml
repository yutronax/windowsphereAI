[package]
name = "windows-ai-files"
version = "0.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"

[profile.release]
lto = true
opt-level = "z"
strip = true
